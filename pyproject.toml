[project]
name = "gopro-charuco-calibrator"
version = "0.1.0"
description = "Local web app for caib.io ChArUco intrinsics calibration from V4L2 cameras."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [
  { name = "GrgaPalcic" }
]
dependencies = [
  "fastapi>=0.115.0",
  "numpy>=2.0.0",
  "opencv-contrib-python-headless>=4.10.0",
  "pydantic>=2.8.0",
  "pyyaml>=6.0.2",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]

[project.scripts]
gopro-charuco = "gopro_charuco_calibrator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gopro_charuco_calibrator"]

[tool.hatch.build.targets.wheel.force-include]
"gopro_charuco_calibrator/static" = "gopro_charuco_calibrator/static"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
