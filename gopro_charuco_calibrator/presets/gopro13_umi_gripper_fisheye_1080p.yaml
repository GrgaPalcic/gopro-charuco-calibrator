title: "GoPro HERO13 + Max Lens Mod 2.0 (UMI gripper)"
# Gripper camera for UMI-style demonstration capture, calibrated exactly as it
# records: Max Lens Mod 2.0 fitted, USB webcam Wide, 1080p. With the mod on, the
# webcam image is a ~167 deg circular fisheye with black corners.
# double_sphere (OpenICC backend, `gopro-charuco setup-openicc`) is the model to
# use; it is the only one valid over the whole circle and is recommended whenever
# it solves. fisheye (Kannala-Brandt) is kept as a Docker-free cross-check.
camera:
  camera_name: gopro13_umi_gripper
  width: 1920
  height: 1080
  fps: 30.0
gopro:
  enabled: true
  max_lens_mod: 2        # 2 = Max Lens 2.0 (setting 189); keep the mod fitted
  webcam_fov: 0          # 0 = Wide
  webcam_resolution: 12  # 12 = 1080p, the webcam maximum
  webcam_port: 8554
  webcam_protocol: TS
board:
  cols: 11
  rows: 8
  square_m: 0.034
  marker_m: 0.025
  aruco_dict: DICT_5X5_100
  start_id: 2
  marker_count: 44
solver:
  models:
    - fisheye
    - double_sphere
