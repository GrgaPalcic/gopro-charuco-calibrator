title: "GoPro HERO13 Central Linear (pinhole / ROS)"
# Rectilinear fallback for a pinhole / ROS image_proc pipeline. Linear (~90 deg)
# is the only GoPro lens a pinhole model fits, at the cost of FOV vs. Wide. Disable
# HyperSmooth/EIS so the firmware dewarp stays fixed. Use this only if the runtime
# stack needs a plain pinhole/plumb_bob model. Keep lens + resolution fixed across
# every run.
camera:
  camera_name: gopro13_central_linear
  device: /dev/video42
  width: 1920
  height: 1080
  fps: 30.0
  fourcc: YUYV
gopro:
  enabled: true
  webcam_fov: 4          # 4 = Linear (rectilinear, ~90 deg)
  webcam_resolution: 12  # 12 = 1080p
  webcam_port: 8554
  webcam_protocol: TS
board:
  cols: 11
  rows: 8
  square_m: 0.034
  marker_m: 0.025
  aruco_dict: DICT_5X5_100
  start_id: 2
  marker_count: 44
solver:
  models:
    - plumb_bob
    - rational_polynomial
