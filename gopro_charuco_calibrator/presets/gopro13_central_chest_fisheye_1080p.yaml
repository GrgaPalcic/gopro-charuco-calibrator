title: "GoPro HERO13 Central / Chest (Wide / fisheye)"
# Chest-mounted egocentric scene camera (the central view, akin to the
# xlerobot middle RGB-D). Wide maximizes workspace + hand/gripper coverage; it is
# a true fisheye, so calibrate with the fisheye model. If you need train/deploy
# image consistency, undistort to a canonical virtual camera downstream rather
# than feeding equidistant intrinsics into pinhole ROS rectification. Keep lens +
# resolution fixed across every run.
camera:
  camera_name: gopro13_central_chest
  device: /dev/video42
  width: 1920
  height: 1080
  fps: 30.0
  fourcc: YUYV
gopro:
  enabled: true
  webcam_fov: 0          # 0 = Wide (native fisheye, ~130 deg)
  webcam_resolution: 12  # 12 = 1080p
  webcam_port: 8554
  webcam_protocol: TS
board:
  cols: 11
  rows: 8
  square_m: 0.034
  marker_m: 0.025
  aruco_dict: DICT_5X5_100
  start_id: 2
  marker_count: 44
solver:
  models:
    - fisheye
