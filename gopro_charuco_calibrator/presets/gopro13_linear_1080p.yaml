title: "HERO13 Linear 1080p (stock lens)"
# Stock lens, USB webcam Linear at 1080p: the firmware de-fishes to a ~90 deg
# rectilinear image, the only GoPro mode a pinhole model fits. Use it when the
# consumer needs a plain ROS camera_info (plumb_bob / rational_polynomial).
camera:
  camera_name: gopro13_linear_1080p
  width: 1920
  height: 1080
  fps: 30.0
gopro:
  enabled: true
  webcam_fov: 4          # 4 = Linear
  webcam_resolution: 12  # 12 = 1080p
  webcam_port: 8554
  webcam_protocol: TS
board:
  cols: 11
  rows: 8
  square_m: 0.034
  marker_m: 0.025
  aruco_dict: DICT_5X5_100
  start_id: 2
  marker_count: 44
solver:
  models:
    - plumb_bob
    - rational_polynomial
